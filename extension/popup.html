<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flash Resume</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 380px;
      background: var(--bg-primary);
      color: var(--text-main);
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      font-size: 20px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-badge.offline .status-dot {
      background: var(--danger);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .field-group {
      margin-bottom: 10px;
    }

    .field-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    textarea {
      resize: vertical;
      min-height: 54px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-view {
      display: none;
    }

    .result-score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .score-circle {
      font-size: 20px;
      font-weight: 800;
      color: var(--success);
    }

    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 500;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .notification {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 12px;
      display: none;
    }

    .notification.warn {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #fde047;
      display: block;
    }

    @media (prefers-reduced-motion: reduce) {
      *, .spinner, .status-dot {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-logo">⚡</span>
      <h1>Flash Resume</h1>
    </div>
    <div id="statusBadge" class="status-badge offline">
      <div class="status-dot"></div>
      <span id="statusText">Checking...</span>
    </div>
  </header>

  <div id="offlineNotice" class="notification warn" style="display: none;">
    ⚠️ Companion engine offline. Run <code>fs serve</code> in your terminal.
  </div>

  <main>
    <div id="tailorForm">
      <div class="card">
        <div class="card-title">Detected Job Details</div>
        <div class="field-group">
          <label for="companyInput">Company Name</label>
          <input type="text" id="companyInput" placeholder="Auto-detected or enter name">
        </div>
        <div class="field-group">
          <label for="roleInput">Job Title / Role</label>
          <input type="text" id="roleInput" placeholder="Auto-detected or enter title">
        </div>
        <div class="field-group">
          <label for="jdInput">Job Description</label>
          <textarea id="jdInput" placeholder="Scraped from active tab or paste JD text..."></textarea>
        </div>
      </div>

      <button id="tailorBtn" class="btn btn-primary">
        <div id="btnSpinner" class="spinner"></div>
        <span id="btnText">⚡ Tailor 1-Page Resume</span>
      </button>
    </div>

    <div id="resultView" class="result-view">
      <div class="card">
        <div class="card-title">Tailoring Completed</div>
        <div class="result-score">
          <div>
            <div style="font-weight: 600; font-size: 14px;" id="resCompanyRole">Company — Role</div>
            <div style="color: var(--text-muted); font-size: 11px;">Single-Page Layout Verified</div>
          </div>
          <div class="score-circle" id="resScore">92%</div>
        </div>

        <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">Integrated Keywords:</div>
        <div id="chipContainer" class="chip-container"></div>
      </div>

      <button id="downloadBtn" class="btn btn-primary" style="margin-bottom: 8px;">
        📥 Download 1-Page PDF
      </button>
      <button id="resetBtn" class="btn" style="background: var(--bg-input); color: var(--text-main);">
        Tailor Another Job
      </button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
